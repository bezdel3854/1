name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q bingx_bot
      - run: python -m bingx_bot.cli backtest --data data/history --out /tmp/research
      - run: python -m bingx_bot.cli research --data data/history --out /tmp/approaches
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bingx-paper:test .
      - run: docker run --rm --entrypoint python bingx-paper:test -c 'from bingx_bot.config import Config; assert Config().risk == 0.005'
